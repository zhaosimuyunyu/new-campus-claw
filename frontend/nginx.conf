resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream campus_backend {
  zone campus_backend 64k;
  server backend:8000 resolve;
  keepalive 16;
}

server {
  listen 80;
  client_max_body_size 52m;
  root /usr/share/nginx/html;
  index index.html;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 240s;
  location / { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://campus_backend; proxy_buffering off; }
  location /admin/ { proxy_pass http://campus_backend; }
  location /static/ { proxy_pass http://campus_backend; }
  location /health/ { proxy_pass http://campus_backend; }
}
